[package]
name = "Pejvak_RVB"
version = "1.2.0"
edition = "2021"
authors = ["Amin Yousefinejad"]
description = "PEJVAK RVB – Hybrid Algorithmic Reverb VST3/CLAP"
license = "GPL-3.0-or-later"
repository = "https://github.com/Pejvak-DSP/PejvakRVB"
homepage = "https://github.com/Pejvak-DSP"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["gui-egui"]
gui-egui = ["dep:egui", "dep:nice-plug-egui", "dep:rfd", "dep:image", "updater"]
dev-checks = ["nice-plug/assert_process_allocs"]
updater = ["dep:ureq", "dep:serde_json", "dep:sha2"]

[dependencies]
egui = { version = "0.37", features = ["default_fonts"], optional = true }
nice-plug-egui = { version = "0.6.0", default-features = false, features = ["wgpu", "keyboard_focus_workaround"], optional = true }
nice-plug = { version = "0.4.2", features = ["unsafe_flush_denormals"] }
rfd = { version = "0.17.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
fdn_reverb_core = { path = "../fdn_reverb_core" }
ureq = { version = "3.3.0", optional = true, default-features = false, features = ["rustls", "json"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse", # Added for SendInput
] }