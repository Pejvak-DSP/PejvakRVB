[package]
name = "fdn_reverb_core"
version = "1.0.1"
edition = "2021"
authors = ["Amin Yousefinejad"]
description = "PEJVAK RVB – Pejvak DSP Core Engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/Pejvak-DSP/PejvakRVB"
homepage = "https://github.com/Pejvak-DSP"

[dependencies]
# Portable SIMD: f64x4 maps to AVX2/AVX-512 on x86_64 and NEON on ARM.
# Used only for operations that are bit-exact with scalar code (elementwise
# mul/add on independent data, no FMA, no reassociation).
wide = "1.6"
