name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Tests and lints — runs once, blocks all builds if it fails
  # ==========================================================================
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run DSP tests
        run: cargo test -p fdn_reverb_core

      - name: Run plugin tests
        run: cargo test -p Pejvak_RVB

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # Windows Build & Inno Setup Installer
  # ==========================================================================
  build-windows:
    name: Build Windows
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          # Inno Setup is pre-installed on every GitHub-hosted Windows
          # runner, so no installation step is needed. It produces a
          # modern wizard with welcome / license / path / components /
          # progress / finish, plus an uninstaller registered in
          # Add or Remove Programs.
          #
          # The nice-plug bundle names its files after the Cargo package
          # ("Pejvak_RVB"), so the source files are Pejvak_RVB.vst3 and
          # Pejvak_RVB.clap.

          $iss = @'
          #define AppName "PEJVAK RVB"
          #define AppVersion GetEnv('APP_VERSION')
          #define Publisher "Pejvak DSP"
          #define PublisherURL "https://github.com/Pejvak-DSP"
          #define SupportURL "https://github.com/Pejvak-DSP/PejvakRVB"
          #define UpdateURL "https://github.com/Pejvak-DSP/PejvakRVB/releases"

          [Setup]
          AppId={{B3D9D3E5-1234-5678-9ABC-DEF012345678}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppVerName={#AppName} {#AppVersion}
          AppPublisher={#Publisher}
          AppPublisherURL={#PublisherURL}
          AppSupportURL={#SupportURL}
          AppUpdatesURL={#UpdateURL}
          DefaultDirName={commoncf}
          DefaultGroupName={#AppName}
          DisableProgramGroupPage=yes
          LicenseFile=LICENSE
          OutputDir=installer-output
          OutputBaseFilename=PEJVAK-RVB-windows-x64-setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayName={#AppName}
          UninstallDisplayIcon={commoncf}\VST3\PEJVAK RVB\Pejvak_RVB.vst3
          VersionInfoVersion={#AppVersion}
          VersionInfoCompany={#Publisher}
          VersionInfoDescription={#AppName} Installer
          VersionInfoProductName={#AppName}
          VersionInfoProductVersion={#AppVersion}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Types]
          Name: "full"; Description: "Full installation (VST3 + CLAP)"
          Name: "custom"; Description: "Custom installation"; Flags: iscustom

          [Components]
          Name: "vst3"; Description: "VST3 plugin — most DAWs (Ableton, Cubase, Logic via bridge, Studio One, Reaper, Bitwig, FL)"; Types: full
          Name: "clap"; Description: "CLAP plugin — Bitwig, Reaper 7+, Qtractor, other CLAP hosts"; Types: full

          [Files]
          Source: "target\bundled\Pejvak_RVB.vst3"; DestDir: "{commoncf}\VST3\PEJVAK RVB"; Components: vst3; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "target\bundled\Pejvak_RVB.clap"; DestDir: "{commoncf}\CLAP"; Components: clap; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Uninstall {#AppName}"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{#UpdateURL}"; Description: "Open the project page"; Flags: postinstall shellexec nowait runasoriginaluser
          '@

          Set-Content -Path installer.iss -Value $iss -Encoding UTF8

          Write-Host "=== Generated installer.iss ==="
          Get-Content installer.iss | Select-Object -First 10

      - name: Compile installer with Inno Setup
        shell: pwsh
        env:
          APP_VERSION_RAW: ${{ github.ref_name }}
        run: |
          # Strip leading "v" from the tag. Inno Setup wants a clean
          # version string like "1.1.0", not "v1.1.0".
          $env:APP_VERSION = $env:APP_VERSION_RAW.TrimStart('v')
          Write-Host "Building installer for version $env:APP_VERSION"

          # ISCC.exe is pre-installed on GitHub Windows runners.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on the runner."
            exit 1
          }
          Write-Host "Using ISCC: $iscc"

          & $iscc /Q installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed (exit code $LASTEXITCODE)."
            exit 1
          }

          $exe = "installer-output\PEJVAK-RVB-windows-x64-setup.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Installer EXE was not produced."
            exit 1
          }
          Get-Item $exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: windows-bundle
          path: installer-output/PEJVAK-RVB-windows-x64-setup.exe

  # ==========================================================================
  # macOS Build & PKG Installer (Universal Binary)
  # ==========================================================================
  build-macos:
    name: Build macOS
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build for Apple Silicon
        run: cargo nice-plug bundle Pejvak_RVB --release --target aarch64-apple-darwin

      - name: Build for Intel
        run: cargo nice-plug bundle Pejvak_RVB --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/libPejvak_RVB.dylib \
            target/x86_64-apple-darwin/release/libPejvak_RVB.dylib \
            -output /tmp/libPejvak_RVB_universal.dylib
          strip -x /tmp/libPejvak_RVB_universal.dylib
          echo "=== Universal binary architectures: ==="
          lipo -info /tmp/libPejvak_RVB_universal.dylib

      - name: Locate Bundle Directory
        run: |
          echo "=== Available bundle directories: ==="
          find target -maxdepth 6 -type d \( -name "*.vst3" -o -name "*.clap" \) 2>/dev/null || true

          BUNDLE_VST3=$(find target -maxdepth 6 -type d -name "Pejvak_RVB.vst3" 2>/dev/null | head -1)

          if [ -z "$BUNDLE_VST3" ]; then
            echo "ERROR: Could not locate Pejvak_RVB.vst3 bundle."
            ls -la target/ || true
            ls -la target/bundled/ 2>/dev/null || true
            exit 1
          fi

          BUNDLE_DIR=$(dirname "$BUNDLE_VST3")
          echo "=== Found bundle directory: $BUNDLE_DIR ==="
          ls -la "$BUNDLE_DIR"

          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Replace Binary with Universal Dylib
        run: |
          MACOS_BIN_DIRS=$(find "$BUNDLE_DIR" -type d -path "*/Contents/MacOS")
          if [ -z "$MACOS_BIN_DIRS" ]; then
            echo "ERROR: No Contents/MacOS/ directory found in bundle."
            find "$BUNDLE_DIR" -type d
            exit 1
          fi

          echo "$MACOS_BIN_DIRS" | while IFS= read -r dir; do
            echo "Updating: $dir"
            find "$dir" -type f -exec cp /tmp/libPejvak_RVB_universal.dylib {} \;
            find "$dir" -type f -exec chmod +x {} \;
          done

          echo "=== Architecture of the installed binary: ==="
          find "$BUNDLE_DIR" -type f -path "*/Contents/MacOS/*" -exec lipo -info {} \;

      - name: Create PKG payload
        run: |
          mkdir -p payload/Library/Audio/Plug-Ins/VST3
          mkdir -p payload/Library/Audio/Plug-Ins/CLAP

          cp -R "$BUNDLE_DIR/Pejvak_RVB.vst3" payload/Library/Audio/Plug-Ins/VST3/
          cp -R "$BUNDLE_DIR/Pejvak_RVB.clap" payload/Library/Audio/Plug-Ins/CLAP/

          xattr -cr "payload/Library/Audio/Plug-Ins/VST3/Pejvak_RVB.vst3"
          xattr -cr "payload/Library/Audio/Plug-Ins/CLAP/Pejvak_RVB.clap"

      - name: Build component PKG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PKG version: $VERSION"

          pkgbuild --root payload \
                   --identifier com.pejvakdsp.rvb \
                   --version "$VERSION" \
                   --install-location / \
                   PEJVAK-RVB-component.pkg

          ls -lh PEJVAK-RVB-component.pkg

      - name: Create installer resources (welcome + license)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p resources

          # Welcome screen — shown first when the user opens the PKG.
          cat > resources/welcome.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: -apple-system, sans-serif; font-size: 13px; color: #1d1d1f; padding: 20px; }
              h1 { font-size: 20px; color: #007aff; margin-top: 0; }
              p { line-height: 1.5; margin: 12px 0; }
              ul { line-height: 1.7; }
              code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
            </style>
          </head>
          <body>
            <h1>PEJVAK RVB</h1>
            <p><strong>Hybrid Algorithmic Reverb — Dual Engine. Pure Rust.</strong></p>
            <p>This installer will place the following files on your Mac:</p>
            <ul>
              <li><code>~/Library/Audio/Plug-Ins/VST3/Pejvak_RVB.vst3</code></li>
              <li><code>~/Library/Audio/Plug-Ins/CLAP/Pejvak_RVB.clap</code></li>
            </ul>
            <p>After installation, open your DAW and rescan plugins. The plugin will appear as <strong>PEJVAK RVB</strong>.</p>
            <p>Click <strong>Continue</strong> to proceed.</p>
          </body>
          </html>
          HTML

          # License screen.
          cp LICENSE resources/LICENSE.txt

          # Distribution manifest — tells productbuild which screens to
          # show and which component PKG to install.
          cat > distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>PEJVAK RVB</title>
              <organization>com.pejvakdsp</organization>
              <options customize="never" require-scripts="false" rootVolumeOnly="true"/>
              <domains enable_localSystem="true"/>
              <welcome file="welcome.html" mime-type="text/html"/>
              <license file="LICENSE.txt" mime-type="text/plain"/>
              <pkg-ref id="com.pejvakdsp.rvb"/>
              <choices-outline>
                  <line choice="default">
                      <line choice="com.pejvakdsp.rvb"/>
                  </line>
              </choices-outline>
              <choice id="default"/>
              <choice id="com.pejvakdsp.rvb" visible="false">
                  <pkg-ref id="com.pejvakdsp.rvb"/>
              </choice>
              <pkg-ref id="com.pejvakdsp.rvb" version="${VERSION}" onConclusion="none">PEJVAK-RVB-component.pkg</pkg-ref>
          </installer-gui-script>
          XML

          echo "=== Resources ==="
          ls -la resources/

      - name: Build final PKG (with welcome + license)
        run: |
          productbuild --distribution distribution.xml \
                       --package-path . \
                       --resources resources \
                       PEJVAK-RVB-macos-universal.pkg

          if [ ! -f "PEJVAK-RVB-macos-universal.pkg" ]; then
            echo "ERROR: PKG was not created."
            exit 1
          fi
          ls -lh PEJVAK-RVB-macos-universal.pkg

      - uses: actions/upload-artifact@v5
        with:
          name: macos-bundle
          path: PEJVAK-RVB-macos-universal.pkg

  # ==========================================================================
  # Linux Build & DEB + tar.gz
  # ==========================================================================
  build-linux:
    name: Build Linux
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Create DEB package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "DEB version: $VERSION"

          # Debian package layout — system-wide install to the standard
          # VST3 and CLAP locations.
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/lib/vst3
          mkdir -p deb/usr/lib/clap

          cp -R "target/bundled/Pejvak_RVB.vst3" deb/usr/lib/vst3/
          cp -R "target/bundled/Pejvak_RVB.clap" deb/usr/lib/clap/

          cat > deb/DEBIAN/control <<EOF
          Package: pejvak-rvb
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Pejvak DSP <info@pejvakdsp.com>
          Homepage: https://github.com/Pejvak-DSP/PejvakRVB
          Description: PEJVAK RVB — Hybrid Algorithmic Reverb
           Dual-engine algorithmic reverb (CloudSeed + FFDN) with Texture Rack
           and built-in updater. Pure Rust, GPL-3.0-or-later.
          EOF

          # The .deb must be built with root-owned files for system install.
          dpkg-deb --build --root-owner-group deb PEJVAK-RVB-linux-x64.deb

          if [ ! -f "PEJVAK-RVB-linux-x64.deb" ]; then
            echo "ERROR: DEB package was not created."
            exit 1
          fi
          ls -lh PEJVAK-RVB-linux-x64.deb

      - name: Create tar.gz (for non-Debian distributions)
        run: |
          cd target/bundled
          tar -czvf ../../PEJVAK-RVB-linux-x64.tar.gz *
          cd ../..

          if [ ! -f "PEJVAK-RVB-linux-x64.tar.gz" ]; then
            echo "ERROR: tar.gz archive was not created."
            exit 1
          fi
          ls -lh PEJVAK-RVB-linux-x64.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: linux-bundle
          path: |
            PEJVAK-RVB-linux-x64.deb
            PEJVAK-RVB-linux-x64.tar.gz

  # ==========================================================================
  # Create GitHub Release (single, after all builds)
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
              -name "*.exe" -o -name "*.pkg" -o -name "*.deb" -o -name "*.tar.gz" \
            \) -exec cp {} release-assets/ \;

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-assets/CHANGELOG.md
          fi

          echo "=== Assets to upload ==="
          ls -lh release-assets/

      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## [$V]" '
              index($0, ver) > 0 { found=1 }
              found && /^## \[/ && index($0, ver) == 0 { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md

            if [ ! -s release-notes.md ]; then
              {
                echo "## What's Changed in $GITHUB_REF_NAME"
                git log --pretty=format:"* %s (%h)" -20
              } > release-notes.md
            fi
          else
            {
              echo "## What's Changed in $GITHUB_REF_NAME"
              git log --pretty=format:"* %s (%h)" -20
            } > release-notes.md
          fi
          echo "=== Release notes ==="
          cat release-notes.md

      - name: Create release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove any previous release with the same tag (retry-safe).
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — deleting for retry."
            gh release delete "${{ github.ref_name }}" --yes
          fi

          gh release create "${{ github.ref_name }}" \
            --title "PEJVAK RVB ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            release-assets/*