name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Tests and lints — runs once, blocks all builds if it fails
  # ==========================================================================
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run DSP tests
        run: cargo test -p fdn_reverb_core

      - name: Run plugin tests
        run: cargo test -p Pejvak_RVB

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # Windows Build & Installer + Portable
  # ==========================================================================
  build-windows:
    name: Build Windows
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      # Unblock the bundled plugin files BEFORE the Inno Setup installer
      # collects them. Files produced by `cargo` on the runner normally
      # have no Mark-of-the-Web (MOTW), but being explicit here is a
      # cheap defence-in-depth: it guarantees the installer never carries
      # MOTW into the installed plugin. MOTW on the installed .vst3 /
      # .clap is what caused Windows Defender to scan the plugin on
      # every first load and hang the DAW when opening the manual.
      - name: Unblock bundled files before packaging
        shell: pwsh
        run: |
          Get-ChildItem -Path target\bundled -Recurse | Unblock-File
          Write-Host "Bundled files unblocked:"
          Get-ChildItem -Path target\bundled -Recurse | Select-Object FullName

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $iss = @'
          #define AppName "PEJVAK RVB"
          #define AppVersion GetEnv('APP_VERSION')
          #define Publisher "Pejvak DSP"
          #define PublisherURL "https://github.com/Pejvak-DSP"
          #define SupportURL "https://github.com/Pejvak-DSP/PejvakRVB"
          #define UpdateURL "https://github.com/Pejvak-DSP/PejvakRVB/releases"

          [Setup]
          AppId={{B3D9D3E5-1234-5678-9ABC-DEF012345678}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppVerName={#AppName} {#AppVersion}
          AppPublisher={#Publisher}
          AppPublisherURL={#PublisherURL}
          AppSupportURL={#SupportURL}
          AppUpdatesURL={#UpdateURL}
          DefaultDirName={commoncf}
          DefaultGroupName={#AppName}
          DisableProgramGroupPage=yes
          LicenseFile=LICENSE
          OutputDir=installer-output
          OutputBaseFilename=PEJVAK-RVB-windows-x64-setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayName={#AppName}
          UninstallDisplayIcon={uninstallexe}
          VersionInfoVersion={#AppVersion}
          VersionInfoCompany={#Publisher}
          VersionInfoDescription={#AppName} Installer
          VersionInfoProductName={#AppName}
          VersionInfoProductVersion={#AppVersion}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Types]
          Name: "full"; Description: "Full installation (VST3 + CLAP)"
          Name: "custom"; Description: "Custom installation"; Flags: iscustom

          [Components]
          Name: "vst3"; Description: "VST3 plugin — most DAWs"; Types: full
          Name: "clap"; Description: "CLAP plugin — Bitwig, Reaper 7+"; Types: full

          [Files]
          Source: "target\bundled\Pejvak_RVB.vst3"; DestDir: "{commoncf}\VST3\PEJVAK RVB"; Components: vst3; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "target\bundled\Pejvak_RVB.clap"; DestDir: "{commoncf}\CLAP"; Components: clap; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Uninstall {#AppName}"; Filename: "{uninstallexe}"

          [Run]
          ; Strip Mark-of-the-Web from the installed plugin files. This is
          ; essential: without it Windows Defender treats the .vst3 and
          ; .clap as downloaded-from-the-internet and scans them on every
          ; first load, which can hang the DAW for several seconds.
          ;
          ; * -LiteralPath avoids wildcard expansion issues.
          ; * waituntilterminated ensures the unblock completes before the
          ;   user can launch the DAW (nowait would race with installation).
          ; * Two separate calls: the VST3 is a directory tree, the CLAP
          ;   is a single file, so they need different -Path arguments.
          Filename: "powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -Command ""Get-ChildItem -LiteralPath '{commoncf}\VST3\PEJVAK RVB' -Recurse -ErrorAction SilentlyContinue | Unblock-File; Get-ChildItem -LiteralPath '{commoncf}\CLAP' -Filter 'Pejvak_RVB.clap' -ErrorAction SilentlyContinue | Unblock-File"""; Flags: runhidden waituntilterminated
          Filename: "{#UpdateURL}"; Description: "Open the project page"; Flags: postinstall shellexec nowait runasoriginaluser
          '@

          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          Write-Host "=== Generated installer.iss ==="
          Get-Content installer.iss | Select-Object -First 20

      - name: Compile installer with Inno Setup
        shell: pwsh
        env:
          APP_VERSION_RAW: ${{ github.ref_name }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION_RAW.TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc /Q installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $exe = "installer-output\PEJVAK-RVB-windows-x64-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE missing"; exit 1 }
          Get-Item $exe | Select-Object Name, Length

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          # Portable version: everything a user needs to drop the plugin
          # into a system plugin folder without an installer. This is
          # what users want when they don't have admin rights, or when
          # they want to test the plugin side by side with another
          # version.
          $portable_dir = "portable"
          New-Item -ItemType Directory -Force -Path $portable_dir | Out-Null

          Copy-Item -Recurse "target\bundled\Pejvak_RVB.vst3" "$portable_dir\Pejvak_RVB.vst3"
          Copy-Item -Recurse "target\bundled\Pejvak_RVB.clap" "$portable_dir\Pejvak_RVB.clap"

          $readme = @"
          PEJVAK RVB — Windows Portable
          =============================

          This is the portable version of the PEJVAK RVB plugin.
          No installer, no registry changes, no uninstaller.

          MANUAL INSTALLATION
          -------------------
          1. Create the plugin folders if they do not exist:

               C:\Program Files\Common Files\VST3\PEJVAK RVB\
               C:\Program Files\Common Files\CLAP\

             (You will need administrator rights for these.)

          2. Copy Pejvak_RVB.vst3 to:
               C:\Program Files\Common Files\VST3\PEJVAK RVB\

          3. Copy Pejvak_RVB.clap to:
               C:\Program Files\Common Files\CLAP\

          4. Open your DAW and rescan plugins.

          REMOVING
          --------
          Simply delete the folders above.

          If Windows Defender warns about the files, right-click the
          extracted folder and choose Properties > Unblock. Or run
          in PowerShell as administrator:

              Get-ChildItem -Recurse | Unblock-File

          For updates, use the plugin's built-in "Check for updates"
          menu, or visit:
              https://github.com/Pejvak-DSP/PejvakRVB/releases
          "@
          Set-Content -Path "$portable_dir\README.txt" -Value $readme -Encoding UTF8

          Compress-Archive -Path "$portable_dir\*" `
                           -DestinationPath "PEJVAK-RVB-windows-x64-portable.zip" `
                           -Force

          Get-Item "PEJVAK-RVB-windows-x64-portable.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: windows-bundle
          path: |
            installer-output/PEJVAK-RVB-windows-x64-setup.exe
            PEJVAK-RVB-windows-x64-portable.zip

  # ==========================================================================
  # macOS Build & PKG Installer + Portable
  # ==========================================================================
  build-macos:
    name: Build macOS
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build for Apple Silicon
        run: cargo nice-plug bundle Pejvak_RVB --release --target aarch64-apple-darwin

      - name: Build for Intel
        run: cargo nice-plug bundle Pejvak_RVB --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/libPejvak_RVB.dylib \
            target/x86_64-apple-darwin/release/libPejvak_RVB.dylib \
            -output /tmp/libPejvak_RVB_universal.dylib
          strip -x /tmp/libPejvak_RVB_universal.dylib
          lipo -info /tmp/libPejvak_RVB_universal.dylib

      - name: Locate Bundle Directory
        run: |
          BUNDLE_VST3=$(find target -maxdepth 6 -type d -name "Pejvak_RVB.vst3" 2>/dev/null | head -1)
          if [ -z "$BUNDLE_VST3" ]; then
            echo "ERROR: Could not locate Pejvak_RVB.vst3 bundle."
            ls -la target/ target/bundled/ 2>/dev/null || true
            exit 1
          fi
          BUNDLE_DIR=$(dirname "$BUNDLE_VST3")
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          echo "Found: $BUNDLE_DIR"

      - name: Replace Binary with Universal Dylib
        run: |
          MACOS_BIN_DIRS=$(find "$BUNDLE_DIR" -type d -path "*/Contents/MacOS")
          if [ -z "$MACOS_BIN_DIRS" ]; then
            echo "ERROR: No Contents/MacOS/ directory found."
            exit 1
          fi
          echo "$MACOS_BIN_DIRS" | while IFS= read -r dir; do
            find "$dir" -type f -exec cp /tmp/libPejvak_RVB_universal.dylib {} \;
            find "$dir" -type f -exec chmod +x {} \;
          done
          find "$BUNDLE_DIR" -type f -path "*/Contents/MacOS/*" -exec lipo -info {} \;

      - name: Create Portable ZIP
        run: |
          mkdir -p portable
          cp -R "$BUNDLE_DIR/Pejvak_RVB.vst3" portable/
          cp -R "$BUNDLE_DIR/Pejvak_RVB.clap" portable/

          xattr -cr "portable/Pejvak_RVB.vst3"
          xattr -cr "portable/Pejvak_RVB.clap"

          cat > portable/README.txt <<'EOF'
          PEJVAK RVB — macOS Portable (Universal Binary)
          ==============================================

          This is the portable version of the PEJVAK RVB plugin.
          It runs natively on both Apple Silicon and Intel Macs.

          MANUAL INSTALLATION
          -------------------
          1. Create the plugin folders if they do not exist:

               ~/Library/Audio/Plug-Ins/VST3/
               ~/Library/Audio/Plug-Ins/CLAP/

             Or, for a system-wide install:

               /Library/Audio/Plug-Ins/VST3/
               /Library/Audio/Plug-Ins/CLAP/
               (requires sudo)

          2. Copy Pejvak_RVB.vst3 to:
               ~/Library/Audio/Plug-Ins/VST3/

          3. Copy Pejvak_RVB.clap to:
               ~/Library/Audio/Plug-Ins/CLAP/

          4. Open your DAW and rescan plugins.

          REMOVING
          --------
          Simply delete the two files above.

          macOS GATEKEEPER NOTE
          ---------------------
          If macOS shows "cannot be opened because the developer
          cannot be verified", open System Settings > Privacy &
          Security > "Open Anyway". This is only necessary once.

          Or remove the quarantine flag manually in Terminal:

              xattr -dr com.apple.quarantine \
                ~/Library/Audio/Plug-Ins/VST3/Pejvak_RVB.vst3
              xattr -dr com.apple.quarantine \
                ~/Library/Audio/Plug-Ins/CLAP/Pejvak_RVB.clap

          For updates, use the plugin's built-in "Check for updates"
          menu, or visit:
              https://github.com/Pejvak-DSP/PejvakRVB/releases
          EOF

          ditto -c -k --sequesterRsrc --keepParent portable \
            PEJVAK-RVB-macos-universal-portable.zip

          ls -lh PEJVAK-RVB-macos-universal-portable.zip

      - name: Create PKG payload
        run: |
          mkdir -p payload/Library/Audio/Plug-Ins/VST3
          mkdir -p payload/Library/Audio/Plug-Ins/CLAP
          cp -R "portable/Pejvak_RVB.vst3" payload/Library/Audio/Plug-Ins/VST3/
          cp -R "portable/Pejvak_RVB.clap" payload/Library/Audio/Plug-Ins/CLAP/

      - name: Build component PKG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --root payload \
                   --identifier com.pejvakdsp.rvb \
                   --version "$VERSION" \
                   --install-location / \
                   PEJVAK-RVB-component.pkg

      - name: Create installer resources
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p resources
          cat > resources/welcome.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><style>
          body{font-family:-apple-system,sans-serif;font-size:13px;color:#1d1d1f;padding:20px}
          h1{font-size:20px;color:#007aff;margin-top:0}p{line-height:1.5;margin:12px 0}
          code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:12px}
          </style></head><body>
          <h1>PEJVAK RVB</h1>
          <p><strong>Hybrid Algorithmic Reverb — Dual Engine. Pure Rust.</strong></p>
          <p>This installer places:</p>
          <p><code>~/Library/Audio/Plug-Ins/VST3/Pejvak_RVB.vst3</code><br>
             <code>~/Library/Audio/Plug-Ins/CLAP/Pejvak_RVB.clap</code></p>
          <p>Rescan plugins in your DAW. The plugin appears as <strong>PEJVAK RVB</strong>.</p>
          </body></html>
          HTML
          cp LICENSE resources/LICENSE.txt

          cat > distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>PEJVAK RVB</title>
              <organization>com.pejvakdsp</organization>
              <options customize="never" require-scripts="false" rootVolumeOnly="true"/>
              <domains enable_localSystem="true"/>
              <welcome file="welcome.html" mime-type="text/html"/>
              <license file="LICENSE.txt" mime-type="text/plain"/>
              <pkg-ref id="com.pejvakdsp.rvb"/>
              <choices-outline>
                  <line choice="default"><line choice="com.pejvakdsp.rvb"/></line>
              </choices-outline>
              <choice id="default"/>
              <choice id="com.pejvakdsp.rvb" visible="false"><pkg-ref id="com.pejvakdsp.rvb"/></choice>
              <pkg-ref id="com.pejvakdsp.rvb" version="${VERSION}" onConclusion="none">PEJVAK-RVB-component.pkg</pkg-ref>
          </installer-gui-script>
          XML

      - name: Build final PKG
        run: |
          productbuild --distribution distribution.xml \
                       --package-path . \
                       --resources resources \
                       PEJVAK-RVB-macos-universal.pkg
          ls -lh PEJVAK-RVB-macos-universal.pkg

      - uses: actions/upload-artifact@v5
        with:
          name: macos-bundle
          path: |
            PEJVAK-RVB-macos-universal.pkg
            PEJVAK-RVB-macos-universal-portable.zip

  # ==========================================================================
  # Linux Build & DEB + tar.gz (tar.gz IS the portable version)
  # ==========================================================================
  build-linux:
    name: Build Linux
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Create DEB package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p deb/DEBIAN deb/usr/lib/vst3 deb/usr/lib/clap
          cp -R "target/bundled/Pejvak_RVB.vst3" deb/usr/lib/vst3/
          cp -R "target/bundled/Pejvak_RVB.clap" deb/usr/lib/clap/
          cat > deb/DEBIAN/control <<EOF
          Package: pejvak-rvb
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Pejvak DSP <info@pejvakdsp.com>
          Homepage: https://github.com/Pejvak-DSP/PejvakRVB
          Description: PEJVAK RVB — Hybrid Algorithmic Reverb
           Dual-engine algorithmic reverb (CloudSeed + FFDN) with Texture Rack
           and built-in updater. Pure Rust, GPL-3.0-or-later.
          EOF
          dpkg-deb --build --root-owner-group deb PEJVAK-RVB-linux-x64.deb
          ls -lh PEJVAK-RVB-linux-x64.deb

      - name: Create Portable tar.gz
        run: |
          mkdir -p portable
          cp -R "target/bundled/Pejvak_RVB.vst3" portable/
          cp -R "target/bundled/Pejvak_RVB.clap" portable/

          cat > portable/README.txt <<'EOF'
          PEJVAK RVB — Linux Portable
          ===========================

          This is the portable version of the PEJVAK RVB plugin.
          For Debian / Ubuntu users, prefer the .deb package —
          it handles installation and provides an uninstall entry.

          MANUAL INSTALLATION
          -------------------
          1. Create the plugin folders if they do not exist:

               ~/.vst3/
               ~/.clap/

             Or, for a system-wide install:

               /usr/lib/vst3/
               /usr/lib/clap/
               (requires sudo)

          2. Copy the VST3 folder to:
               ~/.vst3/Pejvak_RVB.vst3/

             The final path should be:
               ~/.vst3/Pejvak_RVB.vst3/Contents/x86_64-linux/Pejvak_RVB.so

          3. Copy the CLAP file to:
               ~/.clap/Pejvak_RVB.clap

          4. Open your DAW and rescan plugins.

          REMOVING
          --------
          Simply delete the two files above.

          SYSTEM DEPENDENCIES
          -------------------
          The plugin needs the standard X11, OpenGL, and ALSA
          libraries. On Debian / Ubuntu:

              sudo apt-get install -y \
                libx11-6 libxcursor1 libgl1 libglu1-mesa libasound2

          On Fedora:
              sudo dnf install libX11 libXcursor mesa-libGL alsa-lib

          For updates, use the plugin's built-in "Check for updates"
          menu, or visit:
              https://github.com/Pejvak-DSP/PejvakRVB/releases
          EOF

          cd portable
          tar -czvf ../PEJVAK-RVB-linux-x64.tar.gz *
          cd ..
          ls -lh PEJVAK-RVB-linux-x64.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: linux-bundle
          path: |
            PEJVAK-RVB-linux-x64.deb
            PEJVAK-RVB-linux-x64.tar.gz

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
              -name "*.exe" -o -name "*.pkg" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" \
            \) -exec cp {} release-assets/ \;

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-assets/CHANGELOG.md
          fi

          echo "=== Assets to upload ==="
          ls -lh release-assets/

      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## [$V]" '
              index($0, ver) > 0 { found=1 }
              found && /^## \[/ && index($0, ver) == 0 { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              { echo "## What's Changed in $GITHUB_REF_NAME"
                git log --pretty=format:"* %s (%h)" -20
              } > release-notes.md
            fi
          else
            { echo "## What's Changed in $GITHUB_REF_NAME"
              git log --pretty=format:"* %s (%h)" -20
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Create release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release delete "${{ github.ref_name }}" --yes
          fi

          gh release create "${{ github.ref_name }}" \
            --title "PEJVAK RVB ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            release-assets/*