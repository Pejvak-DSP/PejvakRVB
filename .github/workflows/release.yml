name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Tests and lints — runs once, blocks all builds if it fails
  # ==========================================================================
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run DSP tests
        run: cargo test -p fdn_reverb_core

      - name: Run plugin tests
        run: cargo test -p Pejvak_RVB

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # Windows Build & Installer
  # ==========================================================================
  build-windows:
    name: Build Windows
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Create Windows Installer
        shell: pwsh
        run: |
          # The nice-plug bundle names the plugin after its Cargo package
          # ("Pejvak_RVB"), so the files are Pejvak_RVB.vst3 and
          # Pejvak_RVB.clap (underscore, not space).
          #
          # The install script handles both the security-unblock and the
          # copy into the system plugin folders. It gets embedded inside
          # a self-extracting 7z archive.
          $bat_content = @"
          @echo off
          echo =====================================
          echo  Installing PEJVAK RVB for Windows
          echo =====================================
          echo.
          echo Removing Windows security block (Mark of the Web)...
          powershell -Command "Get-ChildItem -Path .\* -Recurse | Unblock-File"

          echo.
          echo Creating plugin directories...
          mkdir "C:\Program Files\Common Files\VST3\PEJVAK RVB" 2>nul
          mkdir "C:\Program Files\Common Files\CLAP" 2>nul

          echo Copying plugins to system folders...
          copy /Y "Pejvak_RVB.vst3" "C:\Program Files\Common Files\VST3\PEJVAK RVB\"
          copy /Y "Pejvak_RVB.clap" "C:\Program Files\Common Files\CLAP\"

          echo.
          echo Installation Complete! Please restart your DAW.
          pause
          "@

          $bat_content | Out-File -FilePath target\bundled\install.bat -Encoding ASCII

          # Package as a self-extracting EXE
          Push-Location target\bundled
          7z a -sfx -mx=9 -ms=on ..\..\PEJVAK-RVB-windows-x64-setup.exe .\*
          Pop-Location

          # Sanity check
          if (-not (Test-Path "PEJVAK-RVB-windows-x64-setup.exe")) {
            Write-Error "Windows installer was not created."
            exit 1
          }
          Get-Item "PEJVAK-RVB-windows-x64-setup.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: windows-bundle
          path: PEJVAK-RVB-windows-x64-setup.exe

  # ==========================================================================
  # macOS Build & Installer (Universal Binary)
  # ==========================================================================
  build-macos:
    name: Build macOS
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build for Apple Silicon
        run: cargo nice-plug bundle Pejvak_RVB --release --target aarch64-apple-darwin

      - name: Build for Intel
        run: cargo nice-plug bundle Pejvak_RVB --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/libPejvak_RVB.dylib \
            target/x86_64-apple-darwin/release/libPejvak_RVB.dylib \
            -output /tmp/libPejvak_RVB_universal.dylib
          strip -x /tmp/libPejvak_RVB_universal.dylib
          echo "=== Universal binary architectures: ==="
          lipo -info /tmp/libPejvak_RVB_universal.dylib

      - name: Locate Bundle Directory
        run: |
          # nice-plug names bundles after the Cargo package
          # ("Pejvak_RVB"), not the plugin display name. Bundle paths
          # depend on whether --target was passed:
          #   Without --target: target/bundled/
          #   With --target X:  target/X/release/bundled/
          # We probe every candidate so the workflow is robust to
          # either layout.
          echo "=== Available bundle directories: ==="
          find target -maxdepth 6 -type d \( -name "*.vst3" -o -name "*.clap" \) 2>/dev/null || true

          BUNDLE_VST3=$(find target -maxdepth 6 -type d -name "Pejvak_RVB.vst3" 2>/dev/null | head -1)

          if [ -z "$BUNDLE_VST3" ]; then
            echo "ERROR: Could not locate Pejvak_RVB.vst3 bundle."
            echo "Contents of target/ (top-level):"
            ls -la target/ || true
            echo "Contents of target/bundled/ (if exists):"
            ls -la target/bundled/ 2>/dev/null || true
            echo "Contents of target/aarch64-apple-darwin/release/ (if exists):"
            ls -la target/aarch64-apple-darwin/release/ 2>/dev/null || true
            echo "Contents of target/x86_64-apple-darwin/release/ (if exists):"
            ls -la target/x86_64-apple-darwin/release/ 2>/dev/null || true
            exit 1
          fi

          BUNDLE_DIR=$(dirname "$BUNDLE_VST3")
          echo "=== Found bundle directory: $BUNDLE_DIR ==="
          echo "Contents:"
          ls -la "$BUNDLE_DIR"

          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Replace Binary with Universal Dylib
        run: |
          # Each bundle's Contents/MacOS/ holds a per-arch dylib.
          # We swap it for the universal one we just built. The binary
          # is named after the plugin, so `find -type f` under MacOS
          # is the safest way to hit every file we need to replace.
          MACOS_BIN_DIRS=$(find "$BUNDLE_DIR" -type d -path "*/Contents/MacOS")
          if [ -z "$MACOS_BIN_DIRS" ]; then
            echo "ERROR: No Contents/MacOS/ directory found in bundle."
            find "$BUNDLE_DIR" -type d
            exit 1
          fi

          echo "$MACOS_BIN_DIRS" | while IFS= read -r dir; do
            echo "Updating: $dir"
            find "$dir" -type f -exec cp /tmp/libPejvak_RVB_universal.dylib {} \;
            find "$dir" -type f -exec chmod +x {} \;
          done

          # Verify the architecture of every binary in the bundle.
          echo "=== Architecture of the installed binary: ==="
          find "$BUNDLE_DIR" -type f -path "*/Contents/MacOS/*" \
            -exec lipo -info {} \;

      - name: Create macOS PKG
        run: |
          # pkgbuild wants a version without the leading "v".
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PKG version: $VERSION"

          mkdir -p payload/Library/Audio/Plug-Ins/VST3
          mkdir -p payload/Library/Audio/Plug-Ins/CLAP

          cp -R "$BUNDLE_DIR/Pejvak_RVB.vst3" payload/Library/Audio/Plug-Ins/VST3/
          cp -R "$BUNDLE_DIR/Pejvak_RVB.clap" payload/Library/Audio/Plug-Ins/CLAP/

          # Remove quarantine attributes before packaging.
          xattr -cr "payload/Library/Audio/Plug-Ins/VST3/Pejvak_RVB.vst3"
          xattr -cr "payload/Library/Audio/Plug-Ins/CLAP/Pejvak_RVB.clap"

          pkgbuild --root payload \
                   --identifier com.pejvakdsp.rvb \
                   --version "$VERSION" \
                   --install-location / \
                   PEJVAK-RVB-macos-universal.pkg

          if [ ! -f "PEJVAK-RVB-macos-universal.pkg" ]; then
            echo "ERROR: PKG was not created."
            exit 1
          fi
          ls -lh PEJVAK-RVB-macos-universal.pkg

      - uses: actions/upload-artifact@v5
        with:
          name: macos-bundle
          path: PEJVAK-RVB-macos-universal.pkg

  # ==========================================================================
  # Linux Build & Archive
  # ==========================================================================
  build-linux:
    name: Build Linux
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug --locked --version 0.1.1

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Package Plugins
        run: |
          cd target/bundled
          tar -czvf ../../PEJVAK-RVB-linux-x64.tar.gz *
          cd ../..

          if [ ! -f "PEJVAK-RVB-linux-x64.tar.gz" ]; then
            echo "ERROR: Linux archive was not created."
            exit 1
          fi
          ls -lh PEJVAK-RVB-linux-x64.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: linux-bundle
          path: PEJVAK-RVB-linux-x64.tar.gz

  # ==========================================================================
  # Create GitHub Release (single, after all builds)
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: [test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.pkg" -o -name "*.tar.gz" \) \
            -exec cp {} release-assets/ \;

          # Attach CHANGELOG.md as a downloadable asset too, so users
          # can read the full history offline. The section for the
          # current version is also used as the release body below.
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-assets/CHANGELOG.md
          fi

          echo "=== Assets to upload ==="
          ls -lh release-assets/

      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## [$V]" '
              index($0, ver) > 0 { found=1 }
              found && /^## \[/ && index($0, ver) == 0 { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md

            if [ ! -s release-notes.md ]; then
              {
                echo "## What's Changed in $GITHUB_REF_NAME"
                git log --pretty=format:"* %s (%h)" -20
              } > release-notes.md
            fi
          else
            {
              echo "## What's Changed in $GITHUB_REF_NAME"
              git log --pretty=format:"* %s (%h)" -20
            } > release-notes.md
          fi
          echo "=== Release notes ==="
          cat release-notes.md

      - name: Create release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh` is pre-installed on every GitHub-hosted runner and is a
          # native binary (no Node dependency), so it avoids the
          # "Node 20 is deprecated" warning that third-party
          # JS-based release actions trigger.
          gh release create "${{ github.ref_name }}" \
            --title "PEJVAK RVB ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            release-assets/*