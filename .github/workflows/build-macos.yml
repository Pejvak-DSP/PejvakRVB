name: Build macOS

on:
  push:
    tags:
      - 'v*' # Trigger only when a version tag (e.g., v1.0.0) is pushed

# Grant the workflow permission to create a Release
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest # Use the latest macOS virtual machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug

      # Build for Apple Silicon (M1/M2/M3)
      - name: Build for Apple Silicon
        run: cargo nice-plug bundle Pejvak_RVB --release --target aarch64-apple-darwin

      # Build for Intel
      - name: Build for Intel
        run: cargo nice-plug bundle Pejvak_RVB --release --target x86_64-apple-darwin

      # Combine both architectures into a single Universal binary
      - name: Create Universal Binary
        run: |
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/libPejvak_RVB.dylib \
            target/x86_64-apple-darwin/release/libPejvak_RVB.dylib \
            -output target/universal/release/libPejvak_RVB.dylib

      # Zip the bundled folder so it can be easily downloaded
      - name: Package Plugins
        run: |
          cd target/universal/release
          zip -r ../../../PEJVAK_RVB_macOS.zip .

      # Upload to GitHub Releases automatically
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: PEJVAK_RVB_macOS.zip
          generate_release_notes: true