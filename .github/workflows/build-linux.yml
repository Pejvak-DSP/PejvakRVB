name: Build Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxcb-dri2-0-dev \
            libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

      - name: Install cargo-nice-plug
        run: cargo install cargo-nice-plug

      - name: Build Plugin
        run: cargo nice-plug bundle Pejvak_RVB --release

      - name: Package Plugins
        run: |
          cd target/bundled
          # لینوکس معمولاً از tar.gz استفاده می‌کند
          tar -czvf ../../PEJVAK_RVB_Linux.tar.gz *

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: PEJVAK_RVB_Linux.tar.gz
          generate_release_notes: true